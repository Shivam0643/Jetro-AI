<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tech Stack</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0f172a; color: #ffffff; font-family: Inter, system-ui, sans-serif; }
      .card { width: 100%; max-width: 520px; padding: 2rem; border-radius: 1.5rem; background: linear-gradient(180deg, rgba(15,23,42,0.96), rgba(15,23,42,0.72)); border: 1px solid rgba(16,185,129,0.2); box-shadow: 0 32px 80px rgba(15,23,42,0.35); }
      .card h2 { margin: 0 0 1rem; font-size: 1.6rem; }
      .stack-list { display: grid; gap: 0.85rem; }
      .stack-item { display: flex; justify-content: space-between; align-items: center; padding: 1rem 1.2rem; border-radius: 1rem; background: rgba(255,255,255,0.04); border: 1px solid rgba(148,163,184,0.12); }
      .stack-item span:first-child { color: #94a3b8; }
      .stack-item span:last-child { color: #ffffff; font-weight: 600; }
    </style>
  </head>
  <body>
    <section class="card">
      <h2>Technology Stack</h2>
      <div class="stack-list">
        <div class="stack-item"><span>Frontend</span><span>React</span></div>
        <div class="stack-item"><span>Backend</span><span>Express + Node.js</span></div>
        <div class="stack-item"><span>Database</span><span>MongoDB</span></div>
        <div class="stack-item"><span>AI</span><span>OpenAI / GPT</span></div>
        <div class="stack-item"><span>Styling</span><span>Tailwind-like UI</span></div>
      </div>
    </section>
  </body>
</html>
