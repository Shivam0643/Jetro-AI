<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job Application Manager</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        background: #0f172a;
        color: #fff;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .frame-shell {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      .header {
        padding: 1rem 1.25rem;
        border-bottom: 1px solid rgba(148, 163, 184, 0.15);
        background: #111827;
      }
      .header h1 {
        margin: 0;
        font-size: 1.1rem;
        letter-spacing: 0.04em;
      }
      .header p {
        margin: 0.5rem 0 0;
        color: #94a3b8;
        font-size: 0.95rem;
      }
      .frame-container {
        flex: 1;
        min-height: 0;
      }
      iframe {
        width: 100%;
        height: 100%;
        border: none;
      }
      .warning {
        padding: 1rem;
        text-align: center;
        color: #f8fafc;
        background: #334155;
      }
    </style>
  </head>
  <body>
    <div class="frame-shell">
      <div class="header">
        <h1>Job Application Manager</h1>
        <p>Embedded app preview from <strong>http://localhost:3000</strong>.</p>
      </div>
      <div class="frame-container">
        <iframe src="http://localhost:3000" title="Job Application Manager"></iframe>
      </div>
      <div class="warning">If the preview does not load, make sure your React dev server is running at <strong>http://localhost:3000</strong>.</div>
    </div>
  </body>
</html>
